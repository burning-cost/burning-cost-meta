[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burning-cost"
version = "0.1.0"
description = "Meta-package installing the full Burning Cost insurance pricing toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Burning Cost", email = "pricing.frontier@gmail.com" },
]
keywords = [
    "insurance",
    "actuarial",
    "pricing",
    "machine learning",
    "causal inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "insurance-causal",
    "insurance-fairness",
    "insurance-monitoring",
    "insurance-conformal",
    "insurance-whittaker",
    "insurance-telematics",
    "insurance-credibility",
    "insurance-frequency-severity",
    "insurance-gam",
    "insurance-governance",
]

[project.urls]
Homepage = "https://burning-cost.github.io"
Repository = "https://github.com/burning-cost/burning-cost"
Documentation = "https://burning-cost.github.io"

[tool.hatch.build.targets.wheel]
packages = ["src/burning_cost"]
